<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sellers - PlantPlace</title>
<link rel="stylesheet" href="styles.css"><script src="app.js"></script></head>
<body>
<div id="chrome-top"></div>
<div class="container">
  <h1>Sellers</h1>
  <div class="grid" id="g"></div>
</div>
<div id="chrome-bottom"></div>
<script>
  g.innerHTML = SELLERS.map(s => `<a class="card" href="seller.html?name=${s}" style="color:inherit;text-decoration:none;display:block;text-align:center;padding:22px">
    <span class="avatar lg">${s[0]}</span><h4 style="margin-top:10px">${s}</h4><div class="tiny">${PRODUCTS.filter(p => p.seller === s).length} listings</div></a>`).join('');
</script>
</body></html>
