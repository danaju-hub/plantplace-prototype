<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PlantPlace</title>
<link rel="stylesheet" href="styles.css"><script src="app.js"></script></head>
<body>
<div id="chrome-top"></div>
<div class="container"><h1>Blog</h1><div class="grid" id="g" style="grid-template-columns:repeat(3,1fr)"></div></div>
<div id="chrome-bottom"></div>
<script>
  g.innerHTML = ARTICLES.map(a => `<a class="card" href="article.html?id=${a.id}" style="display:block;color:inherit;text-decoration:none"><div class="pic" style="background:${a.bg};height:170px">${a.emoji}</div>
    <span class="badge green" style="margin-top:10px">${a.tag}</span><h4 style="margin-top:6px;font-size:18px">${a.title}</h4><div class="tiny">${a.date}</div></a>`).join('');
</script>
</body></html>
